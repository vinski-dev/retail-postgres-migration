version: 2

models:
  - name: dim_customers
    description: "Customer dimension table containing unique customer attributes."
    columns:
      - name: customer_id
        description: "Primary key for customers"
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension table containing unique product attributes."
    columns:
      - name: product_id
        description: "Primary key for products"
        tests:
          - unique
          - not_null

  - name: fact_sales
    description: "Sales fact table at the order line-item level."
    columns:
      - name: order_id
        description: "Identifier for the order"
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key connecting to the customer dimension"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        description: "Foreign key connecting to the product dimension"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
