name: dbt CI Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Spin up a temporary Postgres database on the GitHub runner
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas sqlalchemy psycopg2-binary dbt-postgres kagglehub

      # 2. Ingest the raw data into the temporary CI database
      - name: Ingest Raw Data
        run: python scripts/ingest_to_postgres.py
        env:
          DB_HOST: localhost
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_NAME: ci_olist

      # 3. Install dbt packages (required for dbt_utils)
      - name: Install dbt packages
        run: dbt deps --project-dir dbt_retail

      # 4. Run dbt build using the temporary credentials
      - name: Build data warehouse
        run: dbt build --project-dir dbt_retail --profiles-dir dbt_retail
        env:
          DB_HOST: localhost
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_NAME: ci_olist
