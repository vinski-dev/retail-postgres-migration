name: dbt CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  dbt-build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # defaults:
    #   run:
    #     working-directory: ./dbt_retail

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install dbt-postgres dbt-metricflow

      - name: Create isolated CI profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          dbt_retail:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: postgres
                pass: ci_password
                port: 5432
                dbname: postgres
                schema: ci_analytics
                threads: 4
          EOF

      - name: Run dbt dependencies
        run: dbt deps --project-dir dbt_retail

      - name: Build data warehouse
        run: dbt build --project-dir dbt_retail  --profiles-dir dbt_retail
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Validate Semantic Layer
        run: |
          export DBT_PROFILES_DIR="~/.dbt"
          mf query --metrics total_sales --group-by metric_time__year
